apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-server
  namespace: {{ include "ssi.namespace" . }}
  labels:
    app: mcp-server
    {{- include "ssi.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount.mcpServer }}
  selector:
    matchLabels:
      app: mcp-server
  template:
    metadata:
      labels:
        app: mcp-server
    spec:
      containers:
        - name: mcp-server
          image: "{{ .Values.images.mcpServer.repository }}:{{ .Values.images.mcpServer.tag }}"
          imagePullPolicy: {{ .Values.images.mcpServer.pullPolicy }}
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: PORT
              value: "8000"
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-server
  namespace: {{ include "ssi.namespace" . }}
  labels:
    app: mcp-server
    {{- include "ssi.labels" . | nindent 4 }}
spec:
  selector:
    app: mcp-server
  ports:
    - name: http
      port: {{ .Values.service.mcpServer.port }}
      targetPort: http
