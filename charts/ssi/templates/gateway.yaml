apiVersion: apps/v1
kind: Deployment
metadata:
  name: ssi-gateway
  namespace: {{ include "ssi.namespace" . }}
  labels:
    app: ssi-gateway
    {{- include "ssi.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount.gateway }}
  selector:
    matchLabels:
      app: ssi-gateway
  template:
    metadata:
      labels:
        app: ssi-gateway
    spec:
      containers:
        - name: ssi-gateway
          image: "{{ .Values.images.gateway.repository }}:{{ .Values.images.gateway.tag }}"
          imagePullPolicy: {{ .Values.images.gateway.pullPolicy }}
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: PORT
              value: "8080"
            - name: SSI_GATEWAY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.gateway.authSecretName }}
                  key: {{ .Values.gateway.authSecretKey }}
            - name: CONTROL_BASE
              value: {{ .Values.gateway.controlBase | quote }}
            - name: BUSINESS_MCP_URL
              value: {{ .Values.gateway.businessMcpUrl | quote }}
            - name: ENGINEERING_MCP_URL
              value: {{ .Values.gateway.engineeringMcpUrl | quote }}
            - name: BUSINESS_MCP_HOST
              value: {{ .Values.gateway.businessMcpHost | quote }}
            - name: ENGINEERING_MCP_HOST
              value: {{ .Values.gateway.engineeringMcpHost | quote }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: ssi-gateway
  namespace: {{ include "ssi.namespace" . }}
  labels:
    app: ssi-gateway
    {{- include "ssi.labels" . | nindent 4 }}
  {{- with .Values.service.gateway.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.gateway.type }}
  selector:
    app: ssi-gateway
  ports:
    - name: http
      port: {{ .Values.service.gateway.port }}
      targetPort: http
