# Forgejo's own PostgreSQL (not shared with si-lab's pgvector). Password comes from the
# Secret forgejo-db, created on the lab host (docs/forgejo.md, "Secrets"); never in git.
apiVersion: v1
kind: Service
metadata:
  name: forgejo-postgres
  namespace: forgejo
  labels: {app: forgejo-postgres}
spec:
  clusterIP: None
  selector: {app: forgejo-postgres}
  ports: [{name: postgres, port: 5432, targetPort: 5432}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: forgejo-postgres
  namespace: forgejo
spec:
  serviceName: forgejo-postgres
  replicas: 1
  selector:
    matchLabels: {app: forgejo-postgres}
  template:
    metadata:
      labels: {app: forgejo-postgres}
    spec:
      automountServiceAccountToken: false
      nodeSelector: {kubernetes.io/hostname: gpu-node}
      securityContext:
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: postgres
          image: docker.io/library/postgres:17.11-alpine
          ports: [{containerPort: 5432, name: postgres}]
          env:
            - {name: POSTGRES_DB, value: forgejo}
            - {name: POSTGRES_USER, value: forgejo}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: forgejo-db, key: password}}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 1Gi}
          readinessProbe:
            exec: {command: [pg_isready, -U, forgejo, -d, forgejo]}
            periodSeconds: 10
          livenessProbe:
            exec: {command: [pg_isready, -U, forgejo, -d, forgejo]}
            initialDelaySeconds: 30
            periodSeconds: 20
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
            - {name: run, mountPath: /var/run/postgresql}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: forgejo-postgres}
        - name: run
          emptyDir: {}
