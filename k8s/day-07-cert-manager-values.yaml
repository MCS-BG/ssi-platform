# Moved to node gpu-node with the observability stack: docs/observability-move.md.
# Day 7 (stage B prerequisite): cert-manager, required by the ClickHouse operator's webhook,
# which the Langfuse chart v2 uses to run ClickHouse. Pinned to the version in the langfuse-k8s README.
# Install:
#   helm upgrade -i cert-manager oci://quay.io/jetstack/charts/cert-manager --version v1.20.2 \
#     -n cert-manager -f ~/ai-ops-homelab/k8s/day-07-cert-manager-values.yaml
crds:
  enabled: true

global:
  nodeSelector:
    kubernetes.io/hostname: gpu-node

resources:
  requests:
    cpu: 10m
    memory: 48Mi
  limits:
    memory: 192Mi
prometheus:
  enabled: false

webhook:
  resources:
    requests:
      cpu: 10m
      memory: 24Mi
    limits:
      memory: 96Mi

cainjector:
  resources:
    requests:
      cpu: 10m
      memory: 48Mi
    limits:
      memory: 192Mi

