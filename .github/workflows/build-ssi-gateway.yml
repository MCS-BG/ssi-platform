# Build ghcr.io/<owner>/ssi-gateway (Day 13). Manual only: Actions tab -> "build ssi-gateway" -> Run workflow.
# Needed only for ssi_control_plane_mode = "helm"; the lab and the default cloud
# envs run the code from ConfigMaps. Add a push trigger later if you want CI builds.
name: build ssi-gateway

on:
  push:
    branches: [main]
    paths:
      - "apps/ssi-gateway/**"
      - ".github/workflows/build-ssi-gateway.yml"
      - ".github/workflows/_build-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-ssi-gateway
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/_build-image.yml
    with:
      app: ssi-gateway
    permissions:
      contents: read
      packages: write
