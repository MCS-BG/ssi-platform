# Build ghcr.io/<owner>/engineering-mcp (Day 13). Manual only: Actions tab -> "build engineering-mcp" -> Run workflow.
# Needed only for ssi_control_plane_mode = "helm"; the lab and the default cloud
# envs run the code from ConfigMaps. Add a push trigger later if you want CI builds.
name: build engineering-mcp

on:
  push:
    branches: [main]
    paths:
      - "apps/engineering-mcp/**"
      - ".github/workflows/build-engineering-mcp.yml"
      - ".github/workflows/_build-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-engineering-mcp
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/_build-image.yml
    with:
      app: engineering-mcp
    permissions:
      contents: read
      packages: write
