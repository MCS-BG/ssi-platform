# Build ghcr.io/<owner>/m365-mcp (Day 14) on every push to main that changes apps/m365-mcp/ or its workflow files.
# "Run workflow" on the Actions tab (workflow_dispatch) rebuilds it by hand.
# The lab runs the same code from a ConfigMap (k8s/day-14-m365-mcp.yaml); this image is for Helm mode.
name: build m365-mcp

on:
  push:
    branches: [main]
    paths:
      - "apps/m365-mcp/**"
      - ".github/workflows/build-m365-mcp.yml"
      - ".github/workflows/_build-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-m365-mcp
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/_build-image.yml
    with:
      app: m365-mcp
    permissions:
      contents: read
      packages: write
