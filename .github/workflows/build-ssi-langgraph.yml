# Build ghcr.io/<owner>/ssi-langgraph (Day 17). Manual only: Actions tab -> "build ssi-langgraph" -> Run workflow.
# There is no push trigger on purpose. The lab runs the same code from a ConfigMap
# (k8s/day-17-ssi-langgraph.yaml); this image is for Helm or cloud use later.
# Same steps as _build-image.yml, except the build context: the repository root, because the
# image copies apps/control-layer/server.py next to the LangGraph app (see apps/ssi-langgraph/Dockerfile).
name: build ssi-langgraph

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-ssi-langgraph
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install the pinned packages and pytest
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: --no-deps -r apps/ssi-langgraph/requirements.txt
          python -m pip install --disable-pip-version-check pytest==9.1.1

      - name: Offline tests (fakes only, no network)
        run: python -m pytest -q apps/ssi-langgraph/tests

  build:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Image name (ghcr.io needs lowercase)
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/ssi-langgraph" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr.io with the workflow token
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v6
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=sha,format=short,prefix=
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=ssi-langgraph
            org.opencontainers.image.description=ssi-platform ssi-langgraph image (SSI agent as a LangGraph graph)
            org.opencontainers.image.licenses=MIT

      - name: Build and push (linux/amd64)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/ssi-langgraph/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha,scope=ssi-langgraph
          cache-to: type=gha,mode=max,scope=ssi-langgraph
