# Build ghcr.io/<owner>/control-layer (Day 13). Manual only: Actions tab -> "build control-layer" -> Run workflow.
# Needed only for ssi_control_plane_mode = "helm"; the lab and the default cloud
# envs run the code from ConfigMaps. Add a push trigger later if you want CI builds.
name: build control-layer

on:
  push:
    branches: [main]
    paths:
      - "apps/control-layer/**"
      - ".github/workflows/build-control-layer.yml"
      - ".github/workflows/_build-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-control-layer
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/_build-image.yml
    with:
      app: control-layer
    permissions:
      contents: read
      packages: write
