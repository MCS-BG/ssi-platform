name: CI
# Gate 1 (automatic): every PR and every push to main runs all test suites and the
# manifest-in-sync checks. CD calls this same workflow, so red code never deploys.
on:
  pull_request:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true
jobs:
  test:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            apps/ssi-langgraph/requirements.txt
            apps/m365-mcp/requirements.txt
      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip pytest pyyaml
          python -m pip install --no-deps -r apps/ssi-langgraph/requirements.txt
          python -m pip install -r apps/m365-mcp/requirements.txt
      - name: Run all gates
        run: bash scripts/sdlc/ci.sh
