# Copy to inventory.ini (git-ignored):
#   cp inventory.example.ini inventory.ini
# Host names are the k3s node names. Per-host settings live in host_vars/.
# The SSH user comes from ~/.ssh/config (recommended, see README.md) or from
# the commented ansible_user line at the bottom. Keep real user names out of
# git: inventory.ini is git-ignored, this example is not.

[k3s_server]
d ansible_host=d

[k3s_agent]
# The agent node is reached through the lab host (ProxyJump) when the
# terminal is not on the same LAN.
obs-node ansible_host=<obs-node-ip> ansible_ssh_common_args='-o ProxyJump=d'

[gpu_nodes]
d

[k3s_cluster:children]
k3s_server
k3s_agent

[k3s_cluster:vars]
# ansible_user=<ssh-user>
